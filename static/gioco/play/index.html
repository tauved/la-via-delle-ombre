<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAUH Incubo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}

:root{color-scheme:dark;--ink:#140b1c;--violet:#674CC0;--lime:#CFFE7E;--gold:#d9a640;--paper:#efe6d2}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:Montserrat,system-ui,sans-serif;overflow:hidden}
#game{position:fixed;inset:0;background:#000}
canvas#c{width:100%;height:100%;display:block;image-rendering:auto}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;text-align:center;pointer-events:auto;background:radial-gradient(ellipse at 50% 40%,rgba(103,76,192,.35),rgba(20,11,28,.92) 70%)}
.screen h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(34px,7vw,74px);letter-spacing:.12em;margin:0;color:var(--lime);text-shadow:0 0 30px rgba(207,254,126,.35),0 4px 0 var(--ink)}
.logo{font-family:Cinzel,serif;font-weight:800;font-size:22px;letter-spacing:.5em;color:var(--violet);margin-bottom:-6px}
.tag{font-family:Cinzel,serif;letter-spacing:.3em;font-size:13px;color:var(--gold);margin:0}
.intro{max-width:560px;line-height:1.55;font-size:15px;color:#d8cfe6;margin:4px 0}
.credits{font-size:12px;color:#8e7fb0;letter-spacing:.1em}
button{font-family:Cinzel,serif;font-weight:800;letter-spacing:.2em;background:transparent;color:var(--paper);border:2px solid var(--violet);padding:10px 22px;font-size:14px;cursor:pointer;transition:.15s;pointer-events:auto}
button:focus-visible{background:var(--violet);color:#fff;outline:none;box-shadow:0 0 24px rgba(103,76,192,.6)}
@media (hover:hover){button:hover{background:var(--violet);color:#fff;box-shadow:0 0 24px rgba(103,76,192,.6)}button.big:hover{background:var(--lime);color:var(--ink)}}
button.big{font-size:19px;padding:16px 36px;border-color:var(--lime);color:var(--lime)}
button.big:focus-visible{background:var(--lime);color:var(--ink)}
.controls{font-size:13px;color:#b9a9d9;line-height:1.9;margin-top:10px}
.controls b{color:var(--lime);font-family:Cinzel,serif;letter-spacing:.05em}
.sliders{display:flex;flex-direction:column;gap:8px;font-size:13px;letter-spacing:.1em;color:#b9a9d9}
.sliders label{display:flex;justify-content:space-between;gap:16px;width:260px;align-items:center}
.sliders input{accent-color:var(--lime);width:150px}
.stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats span{font-size:11px;letter-spacing:.3em;color:var(--gold)}
.stats b{font-family:Cinzel,serif;font-size:26px;color:var(--lime)}
/* HUD */
#hud{position:absolute;inset:0;transition:opacity .3s}
#hud.off{opacity:0}
#crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
#crosshair i{position:absolute;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}
#crosshair i:nth-child(1){left:11px;top:0;width:4px;height:7px}#crosshair i:nth-child(2){left:11px;bottom:0;width:4px;height:7px}
#crosshair i:nth-child(3){top:11px;left:0;width:7px;height:4px}#crosshair i:nth-child(4){top:11px;right:0;width:7px;height:4px}
.lbl{font-family:Cinzel,serif;font-size:12px;letter-spacing:.35em;color:var(--gold)}
.val{font-family:Cinzel,serif;font-weight:800;font-size:54px;line-height:1;color:var(--paper);text-shadow:3px 3px 0 var(--ink),0 0 18px rgba(207,254,126,.25)}
#hp{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(22px,env(safe-area-inset-bottom,0px))}
#hp.low .val{color:#ff4d6d;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.bar{width:180px;height:9px;border:2px solid var(--ink);background:rgba(20,11,28,.7);margin-top:6px;outline:1px solid rgba(207,254,126,.35)}
.bar>div{height:100%;background:var(--lime);transition:width .15s}
.bar>div.over{background:#fff}
#ammo{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));text-align:right}
#wname{font-family:Cinzel,serif;font-size:13px;letter-spacing:.25em;color:var(--lime);margin-top:4px}
#slots{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:118px;display:flex;gap:6px}
#slots span{font-family:Cinzel,serif;font-weight:800;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:rgba(20,11,28,.6);color:#55466e;font-size:13px;pointer-events:auto;cursor:pointer}
#slots span.owned{color:var(--paper);border-color:var(--violet)}
#slots span.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
#slots span.owned.cd{background:linear-gradient(0deg,rgba(103,76,192,.9) calc(var(--cd,0)*100%),rgba(20,11,28,.6) 0)}
#slots span.on.cd{color:var(--paper)}
.val.word{font-size:32px;letter-spacing:.06em}
#key{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:120px;font-family:Cinzel,serif;font-size:13px;letter-spacing:.2em;color:#b9a0ff;text-shadow:2px 2px 0 var(--ink)}
#bossbar{position:absolute;left:50%;top:max(22px,env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center}
#bossbar .bar{width:min(520px,70vw);height:12px;margin:6px auto 0}
#bossbar .bar>div{background:linear-gradient(90deg,var(--gold),#fff3c4)}
#area{position:absolute;left:0;right:0;top:18%;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;padding:0 16px}
#area.show{opacity:1;transform:none}
#area .t{font-family:Cinzel,serif;font-weight:800;font-size:clamp(22px,4vw,40px);letter-spacing:.2em;color:var(--lime);text-shadow:3px 3px 0 var(--ink),0 0 30px rgba(207,254,126,.3)}
#area .s{font-size:15px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);margin-top:6px;font-style:italic}
#hintbox{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);font-size:14px;letter-spacing:.08em;color:var(--paper);background:rgba(20,11,28,.75);border:1px solid var(--violet);padding:6px 14px;opacity:0;transition:opacity .2s;white-space:nowrap}
#hintbox.show{opacity:1}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(180,10,40,.55) 100%);opacity:0;pointer-events:none}
#fps{position:absolute;left:12px;top:8px;font-size:11px;color:#8e7fb0}
/* telefono bloccato in verticale: il gioco si dispone di lato e si gioca girando il telefono */
#game.rot{inset:auto;transform-origin:0 0}
button.orient{font-size:11px;padding:8px 14px;border-color:#55466e;color:#b9a9d9}
/* scelta del livello nel titolo */
.levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.levels button{font-size:12px;padding:8px 14px;border-color:#55466e;color:#b9a9d9;letter-spacing:.16em}
.levels button.on{border-color:var(--lime);color:var(--lime);background:rgba(207,254,126,.08)}
html.short .levels button{font-size:10px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){#area,#hintbox,button{transition:none}#hp.low .val{animation:none}}
/* bestiario */
.best-wrap{display:flex;flex-direction:column;gap:14px;width:min(520px,100%);text-align:left}
.best-list{display:flex;flex-wrap:wrap;gap:8px}
.best-list button{font-size:12px;text-align:left;padding:10px 14px}
.best-list button.on{background:var(--violet);color:#fff}
.best-card{min-width:0;background:rgba(20,11,28,.72);border:2px solid var(--violet);padding:18px 22px}
.best-title{font-family:Cinzel,serif;font-weight:800;font-size:24px;color:var(--lime);letter-spacing:.15em}
.best-sub{font-family:Cinzel,serif;font-size:12px;letter-spacing:.25em;color:var(--gold);margin:4px 0 10px}
.best-card p{line-height:1.55;font-size:14px;color:#d8cfe6;margin:0 0 10px}
.best-weak{color:var(--lime)!important;font-style:italic}
#bestiary{align-items:flex-start;padding-left:max(16px,5vw,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(20,11,28,.94) 0%,rgba(20,11,28,.78) 42%,rgba(20,11,28,0) 64%)}
#bestiary>button{align-self:flex-start}
#lock-note{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:13px;color:#b9a9d9;letter-spacing:.1em}
@media (max-width:720px){.val{font-size:40px}.bar{width:130px}html:not(.rotated) #bestiary{justify-content:flex-end;background:linear-gradient(0deg,rgba(20,11,28,.96) 52%,rgba(20,11,28,0) 78%)}.best-card{padding:14px 16px}.best-card p{font-size:13px}}
/* schermo basso (telefono in orizzontale, anche quando il gioco è ruotato) */
html.short .screen{gap:6px;padding-block:10px}
html.short .screen button:not(.big):not(.levels button){padding:7px 18px}
html.short .screen h1{font-size:clamp(28px,5.5vh,46px)}
html.rotated.short .screen h1{font-size:40px}
html.short .logo{font-size:15px}
html.short .tag{font-size:11px}
html.short .intro{font-size:12.5px;margin:0;max-width:680px;line-height:1.38}
html.short .controls{margin-top:0;line-height:1.42;font-size:11px}
html.short .credits{margin:0}
html.short button.big{font-size:16px;padding:8px 26px}
html.short .best-wrap{gap:8px}
html.short .best-card{padding:12px 16px}
html.short .best-card p{font-size:12.5px;margin-bottom:6px}
html.short .best-title{font-size:20px}
html.short .val{font-size:38px}
/* comandi touch */
#touch{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#t-stick{position:absolute;left:90px;top:70%;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid rgba(207,254,126,.45);border-radius:50%;opacity:0;transition:opacity .15s}
#t-stick.on{opacity:1}
#t-knob{position:absolute;left:28px;top:28px;width:50px;height:50px;border-radius:50%;background:rgba(207,254,126,.55);border:2px solid var(--ink)}
#touch button{position:absolute;border-radius:50%;padding:0;font-size:11px;letter-spacing:.1em;background:rgba(20,11,28,.55)}
#t-fire{right:max(22px,env(safe-area-inset-right,0px));bottom:150px;width:96px;height:96px;border-color:var(--lime);color:var(--lime)}
#t-use{right:max(132px,calc(env(safe-area-inset-right,0px) + 110px));bottom:160px;width:58px;height:58px}
#t-weapon{right:max(36px,env(safe-area-inset-right,0px));bottom:262px;width:64px;height:64px}
#touch button.down{background:rgba(207,254,126,.3);color:var(--ink)}
#t-blood{right:max(128px,calc(env(safe-area-inset-right,0px) + 106px));bottom:236px;width:60px;height:60px;border-color:#9b7bff;color:#e9dcff;background:conic-gradient(rgba(103,76,192,.8) calc(var(--cd,1)*360deg),rgba(20,11,28,.55) 0)!important}
#t-blood.ready{border-color:var(--lime);color:var(--lime);box-shadow:0 0 16px rgba(103,76,192,.8)}
/* livello con il lucchetto */
.lock-ic{width:1.05em;height:1.05em;vertical-align:-.15em;margin-right:.45em}
.levels button.locked{color:#b9a9d9;border-style:dashed}
.levels button.locked.on{color:var(--lime)}
.lockbox{display:flex;align-items:center;gap:14px;border:2px solid var(--violet);background:rgba(20,11,28,.72);padding:12px 26px;font-family:Cinzel,serif;font-weight:800;font-size:18px;letter-spacing:.2em;color:var(--lime);box-shadow:0 0 30px rgba(103,76,192,.45)}
.lockbox .lock-big .lock-ic{width:30px;height:30px;margin:0;vertical-align:middle}
html.short .lockbox{font-size:14px;padding:8px 18px}html.short .lockbox .lock-big .lock-ic{width:22px;height:22px}
/* fine livello: arma sbloccata */
.unlock{border:2px solid var(--violet);background:rgba(20,11,28,.75);padding:12px 22px;max-width:520px;box-shadow:0 0 30px rgba(103,76,192,.45)}
.unlock .u-t{font-family:Cinzel,serif;font-size:12px;letter-spacing:.35em;color:var(--gold)}
.unlock .u-n{font-family:Cinzel,serif;font-weight:800;font-size:26px;letter-spacing:.2em;color:var(--lime);margin:4px 0}
.unlock p{margin:0;font-size:13.5px;line-height:1.5;color:#d8cfe6}
html.short .unlock{padding:8px 16px}html.short .unlock .u-n{font-size:20px}html.short .unlock p{font-size:12px}
.unlock p + .u-n{margin-top:10px}
.screen .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* lista delle canzoni */
.songs-list{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:860px}
.song{width:min(200px,38vw,34vh);display:flex;flex-direction:column;align-items:center;gap:6px}
.song .cover{position:relative;width:100%;aspect-ratio:1/1;border:2px solid var(--violet);background:#000;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.song .cover img{width:100%;height:100%;object-fit:cover;display:block}
.song.closed .cover img{filter:grayscale(.85) brightness(.32) blur(2px)}
.song .c-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--lime)}
.song .c-lock .lock-ic{width:30%;height:30%;margin:0}
.song.playing .cover{border-color:var(--lime);box-shadow:0 0 26px rgba(207,254,126,.4),0 6px 0 var(--ink)}
.song .s-t{font-family:Cinzel,serif;font-weight:800;font-size:17px;letter-spacing:.15em;color:var(--lime);margin-top:4px}
.song .s-a{font-size:12px;letter-spacing:.14em;color:#b9a9d9;text-transform:uppercase}
.song .s-lock{font-size:12.5px;line-height:1.4;color:#d8cfe6;text-align:center}
.song .s-play{padding:7px 18px;font-size:13px}
.song.playing .s-play{background:var(--lime);color:var(--ink);border-color:var(--lime)}
html.short .songs-list{gap:16px}html.short .song .s-t{font-size:14px}html.short .song .s-lock{font-size:11px}
#t-pause{right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));width:44px;height:44px}
/* copertina: è il primo fotogramma della pagina (anche l'anteprima nella galleria) e resta finché il gioco
